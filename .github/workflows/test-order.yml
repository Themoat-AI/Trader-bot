# One-click check that paper orders work: Actions -> Test order -> Run workflow.
name: Test order

on:
  workflow_dispatch:
    inputs:
      dollars:
        description: "Dollars to buy (paper money)"
        default: "100"

concurrency:
  group: bot-state             # don't run at the same moment as the bot
  cancel-in-progress: false

jobs:
  test-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Buy and sell
        run: |
          set -o pipefail
          python -m trader.test_order --dollars "${{ inputs.dollars }}" | tee out.txt
          { echo "## Test order"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

# Downloads fresh data, retrains the model and re-runs the backtest every week.
name: Retrain

on:
  schedule:
    - cron: "23 3 * * 0"      # Sundays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TRADER_STATE_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Load saved state
        run: deploy/load_state.sh
      - name: Download, train, backtest
        run: |
          set -o pipefail
          python -m trader.data
          python -m trader.train | tee state/reports/train.md
          python -m trader.backtest | tee state/reports/backtest.md
          { echo "## Retrain"; echo '```'; cat state/reports/train.md state/reports/backtest.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save state
        run: deploy/save_state.sh "Retrain $(date -u +%Y-%m-%d)"

# Downloads fresh data, retrains the model and re-runs the backtest every week.
name: Retrain

on:
  schedule:
    - cron: "23 3 * * 0"      # Sundays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain               # runs alongside the trading loop; state saves retry on conflict
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TRADER_STATE_DIR: ${{ github.workspace }}/state
      TRADER_UNIVERSES: ${{ vars.TRADER_UNIVERSES || 'crypto stocks' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Load saved state
        run: deploy/load_state.sh
      - name: Download, train, backtest
        run: |
          set -o pipefail
          for u in $TRADER_UNIVERSES; do
            python -m trader.data --universe "$u"
            python -m trader.train --universe "$u" | tee "state/reports/${u}_train.md"
            python -m trader.backtest --universe "$u" | tee "state/reports/${u}_backtest.md"
            { echo "## Retrain: $u"; echo '```'; cat "state/reports/${u}_train.md" "state/reports/${u}_backtest.md"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Save state
        run: deploy/save_state.sh "Retrain $(date -u +%Y-%m-%d)"

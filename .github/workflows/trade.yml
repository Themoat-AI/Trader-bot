# Runs one bot cycle every hour on GitHub's servers.
#
# Setup (once): repo Settings -> Secrets and variables -> Actions
#   Secrets:   ALPACA_API_KEY, ALPACA_SECRET_KEY   (your PAPER keys)
#   Variables: TRADER_DRY_RUN = true   to only log decisions without placing paper orders
#              TRADER_UNIVERSES = "crypto stocks" (default) — which markets to trade
name: Trade

on:
  schedule:
    # Every 15 minutes: GitHub often skips or delays scheduled runs, so we try
    # several times an hour. The bot only acts once per hourly bar.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:           # "Run workflow" button on the Actions tab

permissions:
  contents: write              # to save the journal to the bot-state branch

concurrency:
  group: bot-state             # never run two jobs that write state at once
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TRADER_STATE_DIR: ${{ github.workspace }}/state
      TRADER_UNIVERSES: ${{ vars.TRADER_UNIVERSES || 'crypto stocks' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt

      - name: Check keys are set
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::Add ALPACA_API_KEY and ALPACA_SECRET_KEY under Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Load saved state
        run: deploy/load_state.sh

      - name: Train a model for any market that doesn't have one yet
        run: |
          for u in $TRADER_UNIVERSES; do
            if [ ! -f "state/models/$u.npz" ]; then
              python -m trader.data --universe "$u"
              python -m trader.train --universe "$u"
              python -m trader.backtest --universe "$u"
            fi
          done

      - name: Run one bot cycle per market
        run: |
          failed=0
          for u in $TRADER_UNIVERSES; do
            echo "::group::$u"
            python -m trader.bot --once --universe "$u" ${{ vars.TRADER_DRY_RUN != 'true' && '--live' || '' }} || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Summary
        if: always()
        run: |
          for u in $TRADER_UNIVERSES; do
            python -m trader.report --universe "$u" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Save state
        if: always()
        run: deploy/save_state.sh "Bot cycle $(date -u +%Y-%m-%dT%H:%MZ)"
